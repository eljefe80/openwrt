name: ASU build - WattBox

# WattBox builds from eljefe80/openwrt's own `wattbox-lpc32xx-port` branch --
# push-triggered, same reasoning/caveat as RBS40V: every future push to this
# branch now also kicks off a real ~1hr CI build.
#
# wbctl (outlet/LED/metering control daemon) is NOT vendored in this
# branch's package/ dir (confirmed -- checked before writing this) -- per
# the target's own README (target/linux/lpc32xx/README.md), clone it fresh
# each run and select it explicitly.
#
# DEVICE_TYPE:=basic at the target level (target/linux/lpc32xx/Makefile)
# already drops the default router package set for a fresh defconfig -- the
# explicit "is not set" lines below were needed historically on a
# long-lived LOCAL dev .config that had them from before DEVICE_TYPE:=basic
# existed (defconfig doesn't retract a prior explicit =y). A CI run always
# starts from a blank .config, so these are almost certainly redundant here
# -- kept anyway as a zero-cost safety net matching the exact hard-won
# config, not because there's a known reason they're still required.
#
# Firmware update mechanism note: standard `sysupgrade` is CONFIRMED working
# on real WattBox hardware (see SESSION-NOTES.md, 2026-08-24 -- an earlier
# memory claiming the Linux MTD write path was unreliable here was stale;
# FORCE_WORD_WRITE in the CFI driver config fixed it). This pipeline builds
# a normal sysupgrade.bin like the other three devices, not a special-cased
# artifact.
#
# This repo is public and the runner is self-hosted -- only push (to this
# exact branch)/workflow_dispatch/schedule are safe trigger types. Never add
# pull_request/pull_request_target.

on:
  push:
    branches: [wattbox-lpc32xx-port]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, asu-builder]
    steps:
      - name: Force-clean the shared workspace before checkout
        # All 4 device workflows share this exact physical checkout path
        # (_work/<owner>/<repo>/openwrt-src, keyed by repo only, not by
        # workflow or branch), so a mode/permission issue left behind by
        # ANY previous run's containerized build can break checkout's own
        # clean step here -- confirmed via a real failure: EACCES unlinking
        # a file inside build_dir/host/tar-1.35, and a plain `chmod -R
        # u+rwX; rm -rf` did NOT fix it either (also EACCES) -- checked
        # ownership directly on guinevere and these files are owned by a
        # HOST UID (232071) that isn't gha-runner (1002) at all: something
        # inside the container build drops to a different internal UID for
        # at least part of the process despite --entrypoint "", and that
        # UID maps to one of gha-runner's *subordinate* ids (rootless
        # podman's wider uid/gid-map range), which gha-runner has no bare
        # host permission over. `podman unshare` runs inside that same user
        # namespace, where the mapping resolves correctly -- confirmed
        # directly on guinevere before applying here.
        #
        # 2026-09-16: a mid-build `gh run cancel` on a PRIOR run left
        # build_dir un-removable ("Directory not empty" -- twice now,
        # different leftover paths each time, e.g.
        # build_dir/host/u-boot-2026.07/dts/upstream/Bindings once and
        # build_dir/target-arm_cortex-a7+neon-vfpv4_musl_eabi/
        # linux-ipq40xx_generic another time) -- a hard cancel doesn't
        # wait for podman to tear its mounts down cleanly, and whatever's
        # still attached isn't visible to a plain host-level `mount`
        # (checked -- found nothing), so it must only be visible from
        # inside podman's own rootless user/mount namespace. Do the sweep
        # AND the rm from inside that same `podman unshare` context instead
        # of the host's, and don't bother with a `sudo` fallback -- the CI
        # runner user has no sudo at all ("I'm afraid I can't do that"),
        # so that fallback was silently dead code both times this fired.
        # NOTE: this still isn't guaranteed bulletproof against every
        # possible state a cancel could leave -- if it ever fails again,
        # the recovery is a manual `sudo rm -rf` on guinevere itself
        # (has real root), not a workflow change.
        run: |
          podman unshare sh -c '
            for mnt in $(mount | awk -v p="'"$(pwd)"'/openwrt-src" "index(\$3, p) == 1 {print \$3}" | sort -r); do
              umount -l "$mnt" 2>/dev/null || true
            done
            rm -rf openwrt-src
          '

      - name: Checkout eljefe80/openwrt (wattbox-lpc32xx-port)
        uses: actions/checkout@v4
        with:
          repository: eljefe80/openwrt
          ref: wattbox-lpc32xx-port
          path: openwrt-src

      - name: Login to ghcr.io (for pulls, not just the later push)
        # Anonymous pulls of ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21
        # started 403ing (confirmed via a real failed run: "Requesting bearer
        # token: received unexpected HTTP status: 403 Forbidden") once
        # --pull=always forced a real per-run manifest check instead of
        # silently reusing whatever was already cached locally -- GHCR rate-
        # limits anonymous pulls per-IP, and today's many retries used it up.
        # Authenticated pulls get a much higher limit; reuses the same
        # GITHUB_TOKEN the later push step already relies on.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Clone wbctl package
        run: git clone --depth 1 https://github.com/eljefe80/wbctl.git openwrt-src/package/wbctl

      - name: Add openwisp-config feed
        # Re-added 2026-09-16: openwisp-config/monitoring don't fit baked
        # into DEVICE_PACKAGES (confirmed oversized twice, see the size
        # investigation in target/linux/lpc32xx/image/Makefile), but Jeff
        # wants them installable onto the overlay at runtime instead --
        # that needs them to exist as real .apk files in the published
        # feed, which needs this feed source + explicit package selection
        # below (compile-only, deliberately NOT in DEVICE_PACKAGES).
        working-directory: openwrt-src
        run: |
          echo "src-git openwisp https://github.com/openwisp/openwisp-config.git" >> feeds.conf.default
          echo "src-git openwispmonitoring https://github.com/openwisp/openwrt-openwisp-monitoring.git" >> feeds.conf.default

      - name: Update and install feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Seed target config
        working-directory: openwrt-src
        run: |
          cat >> .config <<'EOF'
          CONFIG_TARGET_lpc32xx=y
          CONFIG_TARGET_lpc32xx_generic=y
          CONFIG_TARGET_lpc32xx_generic_DEVICE_snapav_wattbox-wb300vb=y
          CONFIG_IB=y
          CONFIG_PACKAGE_wbctl=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          # openwisp-config/openwisp-monitoring are DELIBERATELY NOT selected
          # here. First attempt set these =y expecting "compile-only, not in
          # the image" -- wrong: OpenWrt package Kconfig options are bool,
          # not tristate (confirmed in scripts/package-metadata.pl -- the
          # tristate branch is dead code, nothing ever sets $pkg->{tristate}),
          # and package/Makefile's PACKAGE_INSTALL_FILES pulls from
          # $(package-y) only. On this single-profile device target, =y
          # ALWAYS means "install into TARGET_DIR", i.e. into the base
          # image -- there is no "select but don't install" via .config here.
          # Real oversize failure confirmed twice this way (2174274 bytes >
          # 1769472 mtd2 capacity, both times). The actual fix: leave them
          # unselected here, and compile+index them as their own explicit
          # step below ("Compile openwisp packages for the feed, not the
          # image") which bypasses .config's package-y install-list entirely.
          # Published to the feed so they can be `apk add`ed onto the overlay
          # at runtime instead (see project_wattbox_wb300vb_recovery memory).
          # wb-picwdt is now a real kernel watchdog driver (CONFIG_WB_PICWDT,
          # drivers/watchdog/wb_picwdt.c), not a userspace daemon -- it
          # mmaps the LPC32xx GPIO block directly in the driver itself, no
          # /dev/mem or preinit hook involved anymore. CONFIG_KERNEL_DEVMEM
          # below predates that fix and is very likely no longer needed at
          # all, but left in as a harmless no-op rather than risk removing
          # something without re-verifying -- not worth another CI cycle
          # just to test removing a no-op.
          CONFIG_KERNEL_DEVMEM=y
          # CONFIG_PACKAGE_dnsmasq is not set
          # CONFIG_PACKAGE_firewall4 is not set
          # CONFIG_PACKAGE_nftables is not set
          # CONFIG_PACKAGE_ppp is not set
          # CONFIG_PACKAGE_ppp-mod-pppoe is not set
          # CONFIG_PACKAGE_odhcpd is not set
          # CONFIG_PACKAGE_odhcp6c is not set
          EOF
          make defconfig

      - name: Wipe stale host-tool build state
        working-directory: openwrt-src
        # MUST run right here, after Seed target config, not earlier -- see
        # build-whw03.yml for the full, hard-won story: `make defconfig`
        # (bare host) itself builds staging_dir/host/bin/mkhash for this
        # device's config, so wiping any earlier doesn't protect anything.
        run: podman unshare rm -rf staging_dir build_dir bin

      - name: Download sources
        working-directory: openwrt-src
        # Also wrapped in the buildworker container -- see build-whw03.yml
        # for the full explanation: `download` builds the whole host-tools
        # chain (mkhash included) on the bare host otherwise, and `make
        # world`'s later containerized run just reuses those stale,
        # glibc-incompatible binaries instead of rebuilding them.
        run: |
          # NOT --pull=always: chased that theory for hours (stale cache, then
          # GHCR rate-limiting, then a suspected parallel-build race) before
          # directly proving on guinevere itself that the real issue was
          # --pull=always's forced re-pull -- the cached image (22 months old,
          # digest sha256:fceb...aea1528, byte-identical to a fresh pull done
          # elsewhere the same day) reliably builds a correct glibc-2.14 mkhash
          # under the exact same -j$(nproc) parallel load as this workflow;
          # only runs invoking --pull=always ever produced an incompatible one.
          # Plain `podman run image:tag` only pulls when nothing is cached, so
          # this stays deterministic without fighting GHCR's anonymous rate limit.
          podman run --rm --user 0:0 --entrypoint "" -e FORCE_UNSAFE_CONFIGURE=1 \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c 'make download -j"$(nproc)" || {
              echo "::group::Verbose re-run for diagnostics (make -j1 V=s download)"
              make -j1 V=s download
              exit 1
            }'

      - name: Build (make world)
        working-directory: openwrt-src
        # Wrapped in the buildworker container (see WHW03 workflow for the
        # full explanation): host tools compiled directly on guinevere's
        # bare Ubuntu 26.04 (glibc 2.38+) failed a real ASU build request
        # with "GLIBC_2.38 not found" against
        # ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 (glibc 2.31).
        run: |
          podman run --rm --user 0:0 --entrypoint "" -e FORCE_UNSAFE_CONFIGURE=1 \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c 'make -j"$(nproc)" world || { make -j1 V=s world; exit 1; }'

      - name: Compile openwisp packages for the feed, not the image
        working-directory: openwrt-src
        # Explicit per-directory compile targets bypass .config's
        # package-y install-list entirely (see the "Seed target config"
        # comment above) -- these two build against the same staging_dir
        # `make world` just populated, so no re-download/re-toolchain-build
        # happens here. `package/index` regenerates the published apk index
        # for every feed subdir (including these two), same as `make world`
        # already did for the feeds that ARE in DEVICE_PACKAGES -- redundant
        # for those, required for these.
        run: |
          podman run --rm --user 0:0 --entrypoint "" -e FORCE_UNSAFE_CONFIGURE=1 \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c '
              make -j"$(nproc)" \
                package/feeds/openwisp/openwisp-config/compile \
                package/feeds/openwispmonitoring/openwisp-monitoring/compile \
              || make -j1 V=s \
                package/feeds/openwisp/openwisp-config/compile \
                package/feeds/openwispmonitoring/openwisp-monitoring/compile
              make package/index
            '

      - name: Publish downloads-tree artifacts
        working-directory: openwrt-src
        run: |
          set -euo pipefail
          TREE=/srv/asu-downloads
          OUT="$TREE/wattbox/targets/lpc32xx/generic"
          mkdir -p "$OUT"
          cp -v bin/targets/lpc32xx/generic/openwrt-imagebuilder-*.tar.* "$OUT"/
          rm -rf "$OUT/packages"
          cp -rv bin/targets/lpc32xx/generic/packages "$OUT"/
          cp -v bin/targets/lpc32xx/generic/profiles.json "$OUT"/

          # Recovery/bring-up tool, not a device deployment artifact -- ASU's
          # ImageBuilder only repackages pre-built packages, it can't produce
          # this (needs a real kernel build). Published here so it's fetchable
          # the same way as everything else, not through the ASU build API.
          # MUST run before the `cd "$OUT"` below -- this path is relative to
          # openwrt-src (this step's working-directory). A prior version of
          # this line was placed AFTER the cd by mistake, so it was silently
          # looking for bin/targets/lpc32xx/generic/... underneath $OUT
          # instead of openwrt-src -- never found anything, two CI cycles
          # burned chasing a phantom OpenWrt build-system bug that never
          # existed. Confirmed via the failed 2026-09-16 04:20 run's own
          # diagnostic block (added then removed) showing even `.config`
          # "missing" from the wrong cwd.
          cp -v bin/targets/lpc32xx/generic/*-initramfs-kernel.bin "$OUT"/ || \
            echo "WARNING: no initramfs-kernel.bin produced -- check CONFIG_TARGET_ROOTFS_INITRAMFS"

          cd "$OUT"
          sha256sum -b openwrt-imagebuilder-*.tar.* > sha256sums
          gpg --batch --yes --pinentry-mode loopback \
            --local-user 21CF087E3594E01D440D5D6E5FB9EC71BB20CCAF \
            --detach-sign --armor --output sha256sums.asc sha256sums

          echo "Published:"
          ls -la "$OUT"

          # Own dedicated branch path ("wattbox") -- no merge needed.
          echo '{"lpc32xx/generic": "arm_arm926ej-s"}' > "$TREE/wattbox/.targets.json"

      - name: Build custom ImageBuilder image
        working-directory: openwrt-src/docker/imagebuilder
        run: |
          podman build \
            --build-arg TARGET=lpc32xx/generic \
            --build-arg FILE_HOST=http://host.containers.internal \
            --build-arg VERSION_PATH=wattbox \
            --build-arg RUN_SETUP=1 \
            -t ghcr.io/eljefe80/imagebuilder:lpc32xx-generic-openwrt-WATTBOX \
            -f Containerfile .

      - name: Push ImageBuilder image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push ghcr.io/eljefe80/imagebuilder:lpc32xx-generic-openwrt-WATTBOX

      - name: Prune dangling podman images
        # --pull=always above means every run leaves the previous
        # buildworker/imagebuilder layers dangling (untagged) on guinevere.
        # if: always() so this still runs on a failed build too -- disk
        # pressure from repeated pulls is exactly worst on a run that keeps
        # failing and retrying. Only removes dangling/untagged images, never
        # anything currently tagged and in use.
        if: always()
        run: podman image prune -f
