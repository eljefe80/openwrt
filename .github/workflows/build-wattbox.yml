name: ASU build - WattBox

# WattBox builds from eljefe80/openwrt's own `wattbox-lpc32xx-port` branch --
# push-triggered, same reasoning/caveat as RBS40V: every future push to this
# branch now also kicks off a real ~1hr CI build.
#
# wbctl (outlet/LED/metering control daemon) is NOT vendored in this
# branch's package/ dir (confirmed -- checked before writing this) -- per
# the target's own README (target/linux/lpc32xx/README.md), clone it fresh
# each run and select it explicitly.
#
# DEVICE_TYPE:=basic at the target level (target/linux/lpc32xx/Makefile)
# already drops the default router package set for a fresh defconfig -- the
# explicit "is not set" lines below were needed historically on a
# long-lived LOCAL dev .config that had them from before DEVICE_TYPE:=basic
# existed (defconfig doesn't retract a prior explicit =y). A CI run always
# starts from a blank .config, so these are almost certainly redundant here
# -- kept anyway as a zero-cost safety net matching the exact hard-won
# config, not because there's a known reason they're still required.
#
# Firmware update mechanism note: standard `sysupgrade` is CONFIRMED working
# on real WattBox hardware (see SESSION-NOTES.md, 2026-08-24 -- an earlier
# memory claiming the Linux MTD write path was unreliable here was stale;
# FORCE_WORD_WRITE in the CFI driver config fixed it). This pipeline builds
# a normal sysupgrade.bin like the other three devices, not a special-cased
# artifact.
#
# This repo is public and the runner is self-hosted -- only push (to this
# exact branch)/workflow_dispatch/schedule are safe trigger types. Never add
# pull_request/pull_request_target.

on:
  push:
    branches: [wattbox-lpc32xx-port]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, asu-builder]
    steps:
      - name: Checkout eljefe80/openwrt (wattbox-lpc32xx-port)
        uses: actions/checkout@v4
        with:
          repository: eljefe80/openwrt
          ref: wattbox-lpc32xx-port
          path: openwrt-src

      - name: Wipe stale host-tool build state
        working-directory: openwrt-src
        # actions/checkout's default clean does NOT reliably purge these on
        # this self-hosted runner -- see build-whw03.yml for the full
        # explanation. Force a clean slate every run.
        run: rm -rf staging_dir build_dir bin

      - name: Clone wbctl package
        run: git clone --depth 1 https://github.com/eljefe80/wbctl.git openwrt-src/package/wbctl

      - name: Add openwisp-config feed
        working-directory: openwrt-src
        run: echo "src-git openwisp https://github.com/openwisp/openwisp-config.git" >> feeds.conf.default

      - name: Update and install feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Seed target config
        working-directory: openwrt-src
        run: |
          cat >> .config <<'EOF'
          CONFIG_TARGET_lpc32xx=y
          CONFIG_TARGET_lpc32xx_generic=y
          CONFIG_TARGET_lpc32xx_generic_DEVICE_snapav_wattbox-wb300vb=y
          CONFIG_IB=y
          CONFIG_PACKAGE_wbctl=y
          CONFIG_PACKAGE_openwisp-config=y
          # CONFIG_PACKAGE_dnsmasq is not set
          # CONFIG_PACKAGE_firewall4 is not set
          # CONFIG_PACKAGE_nftables is not set
          # CONFIG_PACKAGE_ppp is not set
          # CONFIG_PACKAGE_ppp-mod-pppoe is not set
          # CONFIG_PACKAGE_odhcpd is not set
          # CONFIG_PACKAGE_odhcp6c is not set
          EOF
          make defconfig

      - name: Download sources
        working-directory: openwrt-src
        # Also wrapped in the buildworker container -- see build-whw03.yml
        # for the full explanation: `download` builds the whole host-tools
        # chain (mkhash included) on the bare host otherwise, and `make
        # world`'s later containerized run just reuses those stale,
        # glibc-incompatible binaries instead of rebuilding them.
        run: |
          # --pull=always added after the wipe-workspace fix above STILL didn't
          # fix this: proved locally that a genuinely fresh pull of this exact
          # image builds a fully glibc-2.14-compatible mkhash, so the remaining
          # explanation is guinevere's rootless podman using a STALE cached
          # local copy of this tag from earlier smoke-testing, never the same
          # bits ghcr.io serves now. Forces a fresh pull every run.
          podman run --rm --pull=always --user 0:0 --entrypoint "" \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c 'make download -j"$(nproc)"'

      - name: Build (make world)
        working-directory: openwrt-src
        # Wrapped in the buildworker container (see WHW03 workflow for the
        # full explanation): host tools compiled directly on guinevere's
        # bare Ubuntu 26.04 (glibc 2.38+) failed a real ASU build request
        # with "GLIBC_2.38 not found" against
        # ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 (glibc 2.31).
        run: |
          podman run --rm --pull=always --user 0:0 --entrypoint "" \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c 'make -j"$(nproc)" world || { make -j1 V=s world; exit 1; }'

      - name: Publish downloads-tree artifacts
        working-directory: openwrt-src
        run: |
          set -euo pipefail
          TREE=/srv/asu-downloads
          OUT="$TREE/wattbox/targets/lpc32xx/generic"
          mkdir -p "$OUT"
          cp -v bin/targets/lpc32xx/generic/openwrt-imagebuilder-*.tar.* "$OUT"/
          rm -rf "$OUT/packages"
          cp -rv bin/targets/lpc32xx/generic/packages "$OUT"/
          cp -v bin/targets/lpc32xx/generic/profiles.json "$OUT"/

          cd "$OUT"
          sha256sum -b openwrt-imagebuilder-*.tar.* > sha256sums
          gpg --batch --yes --pinentry-mode loopback \
            --local-user 21CF087E3594E01D440D5D6E5FB9EC71BB20CCAF \
            --detach-sign --armor --output sha256sums.asc sha256sums

          echo "Published:"
          ls -la "$OUT"

          # Own dedicated branch path ("wattbox") -- no merge needed.
          echo '{"lpc32xx/generic": "arm_arm926ej-s"}' > "$TREE/wattbox/.targets.json"

      - name: Build custom ImageBuilder image
        working-directory: openwrt-src/docker/imagebuilder
        run: |
          podman build \
            --build-arg TARGET=lpc32xx/generic \
            --build-arg FILE_HOST=http://10.203.16.45 \
            --build-arg VERSION_PATH=wattbox \
            --build-arg RUN_SETUP=1 \
            -t ghcr.io/eljefe80/imagebuilder:lpc32xx-generic-openwrt-WATTBOX \
            -f Containerfile .

      - name: Push ImageBuilder image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push ghcr.io/eljefe80/imagebuilder:lpc32xx-generic-openwrt-WATTBOX
