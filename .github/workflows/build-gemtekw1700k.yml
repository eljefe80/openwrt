name: ASU build - Gemtek W1700K

# Gemtek W1700K (10.203.1.6) builds from real upstream openwrt/openwrt@master
# -- genuinely stock, zero fork changes, same pattern as MX60W (see that
# workflow's own comments for the full reasoning this one copies).
# Deliberately NOT push-triggered off eljefe80/openwrt -- manual dispatch +
# weekly schedule.
#
# base_container is a single global asu.toml setting, pointed at
# ghcr.io/eljefe80/imagebuilder -- this device's source is stock, but it
# still needs its OWN pushed image under that same registry so the shared
# setting keeps working across every device sharing it.
#
# This repo is public and the runner is self-hosted -- only
# workflow_dispatch/schedule are safe trigger types. Never add
# pull_request/pull_request_target.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, asu-builder]
    steps:
      - name: Force-clean the shared workspace before checkout
        run: podman unshare rm -rf openwrt-src

      - name: Checkout upstream OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: master
          path: openwrt-src
          # Full history: scripts/getver.sh counts commits for the revision
          # (rNNNNN). A shallow clone gives r0 on every build, so owut can't
          # tell builds apart and reports "no changes".
          fetch-depth: 0

      - name: Login to ghcr.io (for pulls, not just the later push)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Fetch imagebuilder Containerfile from eljefe80/openwrt
        run: |
          rm -rf docker-imagebuilder-src
          git clone --depth 1 --filter=blob:none --sparse https://github.com/eljefe80/openwrt.git docker-imagebuilder-src
          cd docker-imagebuilder-src
          git sparse-checkout set docker/imagebuilder

      - name: Add openwisp-config feed
        working-directory: openwrt-src
        # fleet: packages gemtekw1700k-0 runs that aren't upstream (its old
        # "tiger" firmware's LuCI apps + luci-theme-glass). Pinned; provenance
        # and review notes in that repo's README.
        run: |
          echo "src-git openwisp https://github.com/openwisp/openwisp-config.git" >> feeds.conf.default
          echo "src-git fleet https://github.com/eljefe80/openwrt-fleet-packages.git^61bc4ea1e12ac1d8cb1f999b932f2218f28989ac" >> feeds.conf.default

      - name: Update and install feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install fleet defaults (ASU, opensoho, owut cron)
        working-directory: openwrt-src
        # Into the generic base-files overlay, so it ships in base-files and
        # reaches ASU-built (ImageBuilder) images on every target. Everything
        # except the opensoho shared secret -- see ONBOARDING.md.
        run: |
          set -euo pipefail
          mkdir -p target/linux/generic/base-files/etc/uci-defaults
          curl -fsSL https://raw.githubusercontent.com/eljefe80/openwrt/master/ci/fleet-defaults.sh \
            -o target/linux/generic/base-files/etc/uci-defaults/97-fleet-defaults

      - name: Install the fleet's persistent apk signing key
        working-directory: openwrt-src
        # Every build signs with the same key (generated once, kept in the
        # runner's home), so all images and ImageBuilders trust it and the
        # merged arch feeds can be re-signed (ci/publish-arch-feed.sh). Only
        # the public half ever goes into images and ImageBuilders.
        run: |
          set -euo pipefail
          K="$HOME/.openwrt-fleet-apk-key/private-key.pem"
          if [ ! -f "$K" ]; then
            mkdir -p "$(dirname "$K")"; chmod 700 "$(dirname "$K")"
            ( umask 077; openssl ecparam -name prime256v1 -genkey -noout -out "$K" )
            echo "::warning::generated a NEW fleet apk signing key"
          fi
          install -m 600 "$K" private-key.pem
          rm -f public-key.pem
          openssl ec -in "$K" -pubout 2>/dev/null

      - name: Seed target config
        working-directory: openwrt-src
        run: |
          cat >> .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_w1700k-ubi=y
          CONFIG_IB=y
          CONFIG_IMAGEOPT=y
          CONFIG_VERSIONOPT=y
          CONFIG_VERSION_REPO="http://10.203.16.45/snapshots"
          CONFIG_PACKAGE_owut=y
          CONFIG_PACKAGE_openwisp-config=y
          # Built into the feed (=m), not forced into the CI image: what
          # gemtekw1700k-0 has installed on top of the defaults, so an ASU
          # build for it resolves every package (/etc/apk/world, 2026-10-07).
          # Fleet feed (not upstream):
          CONFIG_PACKAGE_luci-app-airoha-flowsense=m
          CONFIG_PACKAGE_luci-app-airoha-npu=m
          CONFIG_PACKAGE_luci-app-mlo=m
          CONFIG_PACKAGE_luci-app-w1700k-fancontrol=m
          CONFIG_PACKAGE_luci-app-wifi7=m
          CONFIG_PACKAGE_luci-theme-glass=m
          # Upstream:
          CONFIG_PACKAGE_luci=m
          CONFIG_PACKAGE_luci-app-attendedsysupgrade=m
          CONFIG_PACKAGE_luci-app-package-manager=m
          CONFIG_PACKAGE_openwisp-monitoring=m
          CONFIG_PACKAGE_bpftool-full=m
          CONFIG_PACKAGE_btop=m
          CONFIG_PACKAGE_curl=m
          CONFIG_PACKAGE_dawn=m
          CONFIG_PACKAGE_ethtool-full=m
          CONFIG_PACKAGE_iperf3=m
          CONFIG_PACKAGE_ip-full=m
          CONFIG_PACKAGE_jq=m
          CONFIG_PACKAGE_pciutils=m
          CONFIG_PACKAGE_strace=m
          CONFIG_PACKAGE_tc-full=m
          CONFIG_PACKAGE_ubi-utils=m
          CONFIG_PACKAGE_umdns=m
          CONFIG_PACKAGE_wget-ssl=m
          CONFIG_PACKAGE_wpad-mbedtls=m
          CONFIG_PACKAGE_kmod-br-netfilter=m
          CONFIG_PACKAGE_kmod-hwmon-nct7802=m
          CONFIG_PACKAGE_kmod-ip6tables=m
          CONFIG_PACKAGE_kmod-nft-bridge=m
          CONFIG_PACKAGE_kmod-phy-rtl8261n=m
          CONFIG_PACKAGE_kmod-sched-act-vlan=m
          CONFIG_PACKAGE_kmod-sched-bpf=m
          CONFIG_PACKAGE_kmod-sched-flower=m
          EOF
          make defconfig

      - name: Wipe stale host-tool build state
        working-directory: openwrt-src
        run: podman unshare rm -rf staging_dir build_dir bin

      - name: Download sources
        working-directory: openwrt-src
        run: |
          podman run --rm --user 0:0 --entrypoint "" -e FORCE_UNSAFE_CONFIGURE=1 \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c 'make download -j"$(nproc)" || {
              echo "::group::Verbose re-run for diagnostics (make -j1 V=s download)"
              make -j1 V=s download
              exit 1
            }'

      - name: Build (make world)
        working-directory: openwrt-src
        run: |
          podman run --rm --user 0:0 --entrypoint "" -e FORCE_UNSAFE_CONFIGURE=1 \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c 'make -j"$(nproc)" world || { make -j1 V=s world; exit 1; }'

      - name: Publish downloads-tree artifacts
        working-directory: openwrt-src
        run: |
          set -euo pipefail
          TREE=/srv/asu-downloads
          OUT="$TREE/snapshots/targets/airoha/an7581"
          mkdir -p "$OUT"
          # Drop the previous ImageBuilder first: its filename carries the
          # version, so a stale one would stay in sha256sums and setup.sh's
          # grep would match two names.
          rm -f "$OUT"/openwrt-imagebuilder-*.tar.*
          cp -v bin/targets/airoha/an7581/openwrt-imagebuilder-*.tar.* "$OUT"/
          rm -rf "$OUT/packages"
          cp -rv bin/targets/airoha/an7581/packages "$OUT"/
          cp -v bin/targets/airoha/an7581/profiles.json "$OUT"/

          # openwisp-config/owut (and everything else pulled from a real
          # feed, not this target's own kernel/kmod set) build into
          # bin/packages/<arch>/<feed>/, NOT bin/targets/.../packages --
          # confirmed live on MX60W's real device 2026-09-17: without this,
          # owut check reports nearly every base package "missing to-
          # version" even though the target-specific tree published fine.
          # Same fix as build-mx60w.yml's own publish step.
          # NOTE: real upstream openwrt.org confirms (profiles.json's own
          # arch_packages field) airoha/an7581 and qualcommax/ipq807x SHARE
          # the exact arch string aarch64_cortex-a53, despite this target's
          # own top-level Makefile saying ARCH:=arm -- verified against the
          # real published snapshot, not assumed from that variable. Shared with
          # build-dlwrx36.yml (same arch); see its comment.
          ARCH_OUT="$TREE/snapshots/packages/aarch64_cortex-a53"
          # Merge, don't replace: another target may publish this same arch.
          # Rebuilds + signs the indexes and writes the feeds.conf ASU needs.
          curl -fsSL https://raw.githubusercontent.com/eljefe80/openwrt/master/ci/publish-arch-feed.sh \
            -o "$RUNNER_TEMP/publish-arch-feed.sh"
          bash "$RUNNER_TEMP/publish-arch-feed.sh" bin/packages/aarch64_cortex-a53 "$ARCH_OUT" airoha-an7581 "$PWD"

          cd "$OUT"
          sha256sum -b openwrt-imagebuilder-*.tar.* > sha256sums
          gpg --batch --yes --pinentry-mode loopback \
            --local-user 21CF087E3594E01D440D5D6E5FB9EC71BB20CCAF \
            --detach-sign --armor --output sha256sums.asc sha256sums

          echo "Published:"
          ls -la "$OUT"

          # Shared "snapshots" branch/path -- merge our own target key in with
          # jq, never overwrite the other devices' entries.
          TARGETS_JSON="$TREE/snapshots/.targets.json"
          [ -f "$TARGETS_JSON" ] || echo '{}' > "$TARGETS_JSON"
          jq '. + {"airoha/an7581": "aarch64_cortex-a53"}' "$TARGETS_JSON" > "$TARGETS_JSON.tmp"
          mv "$TARGETS_JSON.tmp" "$TARGETS_JSON"

      - name: Build custom ImageBuilder image
        working-directory: docker-imagebuilder-src/docker/imagebuilder
        run: |
          podman build \
            --build-arg TARGET=airoha/an7581 \
            --build-arg FILE_HOST=http://10.203.16.45 \
            --build-arg VERSION_PATH=snapshots \
            --build-arg RUN_SETUP=1 \
            -t ghcr.io/eljefe80/imagebuilder:airoha-an7581-master \
            -f Containerfile .

      - name: Push ImageBuilder image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push ghcr.io/eljefe80/imagebuilder:airoha-an7581-master

      - name: Prune dangling podman images
        if: always()
        run: podman image prune -f
