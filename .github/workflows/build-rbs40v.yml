name: ASU build - RBS40V

# RBS40V builds from eljefe80/openwrt's own `rbs40v` branch (Jeff's real
# hardware-bringup branch, NOT a CI-only branch like whw03-mesh-packages) --
# push-triggered because any real commit to this branch legitimately means
# the firmware should be rebuilt. Be aware: this means every future push to
# `rbs40v` now also kicks off a real ~1hr CI build, not just the workflow
# file additions that landed it.
#
# led-ring-mqtt is NOT vendored in this branch's package/ dir (confirmed --
# checked before writing this, not assumed) -- cloned fresh each run, per
# the existing project memory's instruction. mosquitto-client-nossl,
# rbs40v-inittab, bccmd are already in-tree on this branch.
#
# Real gotcha already on record for this board (see TARGETS.md/project
# memory): DEVICE_PACKAGES alone does NOT get led-ring-mqtt built --
# defconfig's auto-select doesn't reliably pick up a freshly-cloned external
# package here, needs an explicit CONFIG_PACKAGE_led-ring-mqtt=y too.
#
# This repo is public and the runner is self-hosted -- only push (to this
# exact branch, never a catch-all)/workflow_dispatch/schedule are safe
# trigger types. Never add pull_request/pull_request_target.

on:
  push:
    branches: [rbs40v]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, asu-builder]
    steps:
      - name: Force-clean the shared workspace before checkout
        # All 4 device workflows share this exact physical checkout path
        # (_work/<owner>/<repo>/openwrt-src, keyed by repo only, not by
        # workflow or branch), so a mode/permission issue left behind by
        # ANY previous run's containerized build can break checkout's own
        # clean step here -- confirmed via a real failure: EACCES unlinking
        # a file inside build_dir/host/tar-1.35, and a plain `chmod -R
        # u+rwX; rm -rf` did NOT fix it either (also EACCES) -- checked
        # ownership directly on guinevere and these files are owned by a
        # HOST UID (232071) that isn't gha-runner (1002) at all: something
        # inside the container build drops to a different internal UID for
        # at least part of the process despite --entrypoint "", and that
        # UID maps to one of gha-runner's *subordinate* ids (rootless
        # podman's wider uid/gid-map range), which gha-runner has no bare
        # host permission over. `podman unshare` runs inside that same user
        # namespace, where the mapping resolves correctly -- confirmed
        # directly on guinevere before applying here.
        run: podman unshare rm -rf openwrt-src

      - name: Checkout eljefe80/openwrt (rbs40v)
        uses: actions/checkout@v4
        with:
          repository: eljefe80/openwrt
          ref: rbs40v
          path: openwrt-src

      - name: Login to ghcr.io (for pulls, not just the later push)
        # Anonymous pulls of ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21
        # started 403ing (confirmed via a real failed run: "Requesting bearer
        # token: received unexpected HTTP status: 403 Forbidden") once
        # --pull=always forced a real per-run manifest check instead of
        # silently reusing whatever was already cached locally -- GHCR rate-
        # limits anonymous pulls per-IP, and today's many retries used it up.
        # Authenticated pulls get a much higher limit; reuses the same
        # GITHUB_TOKEN the later push step already relies on.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Clone led-ring-mqtt package
        run: git clone --depth 1 https://github.com/eljefe80/led-ring-mqtt.git openwrt-src/package/led-ring-mqtt

      - name: Add openwisp-config feed
        working-directory: openwrt-src
        run: |
          echo "src-git openwisp https://github.com/openwisp/openwisp-config.git" >> feeds.conf.default
          echo "src-git openwisp-monitoring https://github.com/openwisp/openwrt-openwisp-monitoring.git" >> feeds.conf.default

      - name: Update and install feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Seed target config
        working-directory: openwrt-src
        run: |
          cat >> .config <<'EOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_netgear_rbs40v=y
          CONFIG_IB=y
          CONFIG_PACKAGE_led-ring-mqtt=y
          CONFIG_PACKAGE_openwisp-config=y
          CONFIG_PACKAGE_openwisp-monitoring=y
          EOF
          make defconfig

      - name: Wipe stale host-tool build state
        working-directory: openwrt-src
        # MUST run right here, after Seed target config, not earlier -- see
        # build-whw03.yml for the full, hard-won story: `make defconfig`
        # (bare host) itself builds staging_dir/host/bin/mkhash for this
        # device's config, so wiping any earlier doesn't protect anything.
        run: podman unshare rm -rf staging_dir build_dir bin

      - name: Download sources
        working-directory: openwrt-src
        # Also wrapped in the buildworker container -- see build-whw03.yml
        # for the full explanation: `download` builds the whole host-tools
        # chain (mkhash included) on the bare host otherwise, and `make
        # world`'s later containerized run just reuses those stale,
        # glibc-incompatible binaries instead of rebuilding them.
        run: |
          # NOT --pull=always: chased that theory for hours (stale cache, then
          # GHCR rate-limiting, then a suspected parallel-build race) before
          # directly proving on guinevere itself that the real issue was
          # --pull=always's forced re-pull -- the cached image (22 months old,
          # digest sha256:fceb...aea1528, byte-identical to a fresh pull done
          # elsewhere the same day) reliably builds a correct glibc-2.14 mkhash
          # under the exact same -j$(nproc) parallel load as this workflow;
          # only runs invoking --pull=always ever produced an incompatible one.
          # Plain `podman run image:tag` only pulls when nothing is cached, so
          # this stays deterministic without fighting GHCR's anonymous rate limit.
          echo "::group::Forensics: host-side state before podman run"
          id
          podman --version
          podman info --format '{{.Host.Security.Rootless}} {{.Store.GraphRoot}}' 2>&1
          podman ps -a 2>&1
          echo "::endgroup::"
          podman run --rm --user 0:0 --entrypoint "" -e FORCE_UNSAFE_CONFIGURE=1 \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c '
              echo "::group::Forensics: inside container before make"
              id
              ldd --version | head -1
              readlink -f /usr/bin/cc
              echo "::endgroup::"
              make download -j"$(nproc)" || {
                echo "::group::Forensics: state at failure"
                readlink -f /workdir/staging_dir/host/bin/gcc 2>&1
                stat /workdir/staging_dir/host/bin/mkhash 2>&1
                objdump -T /workdir/staging_dir/host/bin/mkhash 2>&1 | grep GLIBC | sort -u -t_ -k2 -V | tail -5
                echo "::endgroup::"
                echo "::group::Verbose re-run for diagnostics (make -j1 V=s download)"
                make -j1 V=s download
                exit 1
              }'

      - name: Build (make world)
        working-directory: openwrt-src
        # On failure, re-run once at -j1 V=s: the previous retry's
        # "ERROR: target/linux failed to build" printed with NO underlying
        # diagnostic at all under default quiet mode -- OpenWrt's own hint
        # text says exactly this ("re-run make with -j1 V=s ... to see
        # what's going on"). Doubles time on a real failure, but only then.
        #
        # Also wrapped in the buildworker container (see WHW03 workflow for
        # the full explanation): host tools compiled directly on guinevere's
        # bare Ubuntu 26.04 (glibc 2.38+) failed a real ASU build request
        # with "GLIBC_2.38 not found" against
        # ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 (glibc 2.31).
        #
        # apt-get install device-tree-compiler: RBS40V's own
        # scripts/mkits-rbs40v-fit.sh needs `dtc` (mkimage shells out to it
        # for FIT images) -- this was already a known gotcha, previously
        # fixed by installing it on guinevere's BARE HOST, but that doesn't
        # carry over now that the build correctly runs inside this container
        # instead. Confirmed via a real failure: "sh: 1: dtc: not found",
        # which then made mkimage fall back to a different, also-broken
        # codepath ("Can't open ...factory.chk.tmp") -- the real error is
        # the missing dtc, not that second, misleading one. Root inside the
        # container (--user 0:0) can apt-get install directly, unlike
        # gha-runner on the bare host, which has no sudo at all.
        run: |
          podman run --rm --user 0:0 --entrypoint "" -e FORCE_UNSAFE_CONFIGURE=1 \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c '
              apt-get update -qq && apt-get install -y -qq device-tree-compiler
              make -j"$(nproc)" world || {
                echo "::group::Verbose re-run for diagnostics (make -j1 V=s world)"
                make -j1 V=s world
                exit 1
              }
            '

      - name: Publish downloads-tree artifacts
        working-directory: openwrt-src
        run: |
          set -euo pipefail
          TREE=/srv/asu-downloads
          OUT="$TREE/rbs40v/targets/ipq40xx/generic"
          mkdir -p "$OUT"
          cp -v bin/targets/ipq40xx/generic/openwrt-imagebuilder-*.tar.* "$OUT"/
          rm -rf "$OUT/packages"
          cp -rv bin/targets/ipq40xx/generic/packages "$OUT"/
          cp -v bin/targets/ipq40xx/generic/profiles.json "$OUT"/

          cd "$OUT"
          sha256sum -b openwrt-imagebuilder-*.tar.* > sha256sums
          gpg --batch --yes --pinentry-mode loopback \
            --local-user 21CF087E3594E01D440D5D6E5FB9EC71BB20CCAF \
            --detach-sign --armor --output sha256sums.asc sha256sums

          echo "Published:"
          ls -la "$OUT"

          # Own dedicated branch path ("rbs40v", not "snapshots") -- nothing
          # else will ever share this exact path, so a plain overwrite is
          # fine here, unlike WHW03/MX60W's shared snapshots/.targets.json.
          echo '{"ipq40xx/generic": "arm_cortex-a7_neon-vfpv4"}' > "$TREE/rbs40v/.targets.json"

      - name: Build custom ImageBuilder image
        working-directory: openwrt-src/docker/imagebuilder
        run: |
          podman build \
            --build-arg TARGET=ipq40xx/generic \
            --build-arg FILE_HOST=http://10.203.16.45 \
            --build-arg VERSION_PATH=rbs40v \
            --build-arg RUN_SETUP=1 \
            -t ghcr.io/eljefe80/imagebuilder:ipq40xx-generic-openwrt-RBS40V \
            -f Containerfile .

      - name: Push ImageBuilder image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push ghcr.io/eljefe80/imagebuilder:ipq40xx-generic-openwrt-RBS40V

      - name: Prune dangling podman images
        # --pull=always above means every run leaves the previous
        # buildworker/imagebuilder layers dangling (untagged) on guinevere.
        # if: always() so this still runs on a failed build too -- disk
        # pressure from repeated pulls is exactly worst on a run that keeps
        # failing and retrying. Only removes dangling/untagged images, never
        # anything currently tagged and in use.
        if: always()
        run: podman image prune -f
