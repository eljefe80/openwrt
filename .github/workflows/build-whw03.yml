name: ASU build - WHW03

# UPDATED 2026-09-11: now checks out eljefe80/openwrt@whw03-mesh-packages, NOT
# upstream openwrt/openwrt -- WHW03 needed its own fork branch the moment
# mesh packages (dawn, umdns, owut, kmod-vxlan, ip-full/bridge,
# wpad-mesh-mbedtls, luci-app-attendedsysupgrade) got baked into
# DEVICE_PACKAGES for linksys_whw03v2 (target/linux/ipq40xx/image/generic.mk
# on that branch), instead of requested per-build via ASU's `packages` field
# like the original ~/nanoclaw/whw03-mesh/HOWTO-mesh-node.md did. This also
# means ASU's base_container can no longer be the official
# ghcr.io/openwrt/imagebuilder -- ImageBuilder doesn't recompile from source
# per build, it bakes a fixed DEVICE_PACKAGES list into the image itself, so
# our patch only reaches real builds via a custom-built image from THIS
# patched source (see the new steps below + docker/imagebuilder/ in this same
# branch). Real, hard-required GPG signing now applies too -- the
# openwrt/docker Containerfile setup.sh this reuses verifies sha256sums.asc
# and hard-fails without it. See opensoho-asu-stack/secrets/README.md for the
# signing key (public half only; private key lives solely on guinevere).
#
# Still deliberately NOT push-triggered off this repo (manual dispatch +
# weekly schedule) -- this repo is public and the runner is self-hosted, so
# only push/workflow_dispatch/schedule are safe trigger types, and even
# push here would need to be scoped to this exact branch, never a catch-all.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read
  packages: write # needed to push the imagebuilder image to ghcr.io

jobs:
  build:
    runs-on: [self-hosted, asu-builder]
    steps:
      - name: Force-clean the shared workspace before checkout
        # All 4 device workflows share this exact physical checkout path
        # (_work/<owner>/<repo>/openwrt-src, keyed by repo only, not by
        # workflow or branch), so a mode/permission issue left behind by
        # ANY previous run's containerized build can break checkout's own
        # clean step here -- confirmed via a real failure: EACCES unlinking
        # a file inside build_dir/host/tar-1.35, and a plain `chmod -R
        # u+rwX; rm -rf` did NOT fix it either (also EACCES) -- checked
        # ownership directly on guinevere and these files are owned by a
        # HOST UID (232071) that isn't gha-runner (1002) at all: something
        # inside the container build drops to a different internal UID for
        # at least part of the process despite --entrypoint "", and that
        # UID maps to one of gha-runner's *subordinate* ids (rootless
        # podman's wider uid/gid-map range), which gha-runner has no bare
        # host permission over. `podman unshare` runs inside that same user
        # namespace, where the mapping resolves correctly -- confirmed
        # directly on guinevere before applying here.
        #
        # 2026-09-16: a mid-build `gh run cancel` on the WattBox workflow
        # (same shared checkout path) left a stray mount/overlay attached
        # under build_dir (rm -rf failed with "Directory not empty" on
        # build_dir/host/u-boot-2026.07/dts/upstream/Bindings, not an
        # ownership error) -- a hard cancel doesn't wait for podman to tear
        # its mounts down cleanly. `podman unshare rm -rf` alone can't fix
        # that (it's not a namespace/ownership problem), so it failed the
        # whole job outright and needed a manual `sudo rm -rf` on guinevere
        # to recover. Sweep any lingering mounts under this path first,
        # then fall back to `sudo rm -rf` (bypasses ownership entirely) if
        # the namespaced rm still can't finish -- covers both failure
        # modes without needing to know in advance which one a given prior
        # run left. Applied to all 4 device workflows since they share
        # this exact path/runner.
        run: |
          for mnt in $(mount | awk -v p="$(pwd)/openwrt-src" 'index($3, p) == 1 {print $3}' | sort -r); do
            sudo umount -l "$mnt" || true
          done
          podman unshare rm -rf openwrt-src || sudo rm -rf openwrt-src

      - name: Checkout eljefe80/openwrt (whw03-mesh-packages)
        uses: actions/checkout@v4
        with:
          repository: eljefe80/openwrt
          ref: whw03-mesh-packages
          path: openwrt-src

      - name: Login to ghcr.io (for pulls, not just the later push)
        # Anonymous pulls of ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21
        # started 403ing (confirmed via a real failed run: "Requesting bearer
        # token: received unexpected HTTP status: 403 Forbidden") once
        # --pull=always forced a real per-run manifest check instead of
        # silently reusing whatever was already cached locally -- GHCR rate-
        # limits anonymous pulls per-IP, and today's many retries used it up.
        # Authenticated pulls get a much higher limit; reuses the same
        # GITHUB_TOKEN the later push step already relies on.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Add openwisp-config feed
        working-directory: openwrt-src
        # For opensoho check-in. Real facts confirmed against the actual
        # package repo (github.com/openwisp/openwisp-config), not guessed:
        # package name is exactly "openwisp-config", no branch suffix needed
        # (defaults to its own master). The actual server URL + shared secret
        # are NOT baked in here -- see this repo's own commit message and
        # opensoho-asu-stack/CI.md for why (public repo, can't hold a secret).
        run: |
          echo "src-git openwisp https://github.com/openwisp/openwisp-config.git" >> feeds.conf.default
          echo "src-git openwispmonitoring https://github.com/openwisp/openwrt-openwisp-monitoring.git" >> feeds.conf.default

      - name: Update and install feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Seed target config
        working-directory: openwrt-src
        run: |
          cat >> .config <<'EOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_IB=y
          CONFIG_PACKAGE_openwisp-config=y
          CONFIG_PACKAGE_openwisp-monitoring=y
          EOF
          # Two devices (linksys_whw03v2 + linksys_whw03) means the plain
          # single-choice symbol (CONFIG_TARGET_ipq40xx_generic_DEVICE_x=y)
          # can't be used for both -- confirmed the hard way: a real build
          # succeeded, but profiles.json only had linksys_whw03, because
          # that symbol is a Kconfig `choice` (mutually exclusive), and the
          # second .config line silently overrode the first ("warning:
          # override: ... changes choice state"). The real multi-device
          # mechanism, from scripts/target-metadata.pl: CONFIG_TARGET_
          # MULTI_PROFILE=y switches the whole target to a separate,
          # non-choice "Target Devices" menu, where each device's symbol
          # gains an extra "DEVICE_" (CONFIG_TARGET_DEVICE_<target>_<sub
          # target>_DEVICE_<name>=y, not the single-choice CONFIG_TARGET_
          # <target>_<subtarget>_DEVICE_<name>=y) -- those ARE independent
          # booleans and coexist fine.
          cat >> .config <<'EOF'
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_ipq40xx_generic_DEVICE_linksys_whw03v2=y
          CONFIG_TARGET_DEVICE_ipq40xx_generic_DEVICE_linksys_whw03=y
          EOF
          make defconfig

      - name: Wipe stale host-tool build state
        working-directory: openwrt-src
        # MUST run right here, after `Seed target config`, not earlier --
        # this took a full day of chasing wrong theories (stale image cache,
        # GHCR rate-limiting, a suspected parallel-build race) before real
        # forensic evidence from an actual failed run proved it: mkhash's own
        # birth timestamp fell BEFORE this step's container even started,
        # meaning `make defconfig` in Seed target config -- which runs on the
        # bare host, not containerized -- builds staging_dir/host/bin/mkhash
        # itself for some device configs (confirmed: RBS40V hits this,
        # WHW03's simpler config doesn't). Every manual reproduction attempt
        # had accidentally wiped AFTER defconfig instead of before it, which
        # is exactly why none of them ever reproduced the failure. Wiping
        # here, immediately before the containerized Download sources step,
        # actually protects against what defconfig just built on the bare
        # host, instead of protecting against nothing.
        run: podman unshare rm -rf staging_dir build_dir bin

      - name: Download sources
        working-directory: openwrt-src
        # Also wrapped in the buildworker container: `download` depends on
        # tools/flock/compile (include/toplevel.mk) whenever
        # staging_dir/host/bin/flock doesn't exist yet, which pulls in the
        # WHOLE host-tools chain (mkhash included) -- keep this containerized
        # regardless of the Wipe step above, since anything host-tool related
        # needs to be built against the container's own glibc, never the bare
        # host's (see the Wipe step's comment for the real, fully-diagnosed
        # story of how host-tool builds were leaking in from the bare host).
        run: |
          # NOT --pull=always: chased that theory for hours (stale cache, then
          # GHCR rate-limiting, then a suspected parallel-build race) before
          # directly proving on guinevere itself that the real issue was
          # --pull=always's forced re-pull -- the cached image (22 months old,
          # digest sha256:fceb...aea1528, byte-identical to a fresh pull done
          # elsewhere the same day) reliably builds a correct glibc-2.14 mkhash
          # under the exact same -j$(nproc) parallel load as this workflow;
          # only runs invoking --pull=always ever produced an incompatible one.
          # Plain `podman run image:tag` only pulls when nothing is cached, so
          # this stays deterministic without fighting GHCR's anonymous rate limit.
          podman run --rm --user 0:0 --entrypoint "" -e FORCE_UNSAFE_CONFIGURE=1 \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c 'make download -j"$(nproc)" || {
              echo "::group::Verbose re-run for diagnostics (make -j1 V=s download)"
              make -j1 V=s download
              exit 1
            }'

      - name: Build (make world)
        working-directory: openwrt-src
        # Real bug, found and fixed 2026-09-12: host tools (fakeroot etc.)
        # compiled directly on guinevere's bare Ubuntu 26.04 (glibc 2.38+)
        # can't run inside the imagebuilder container later, which is based
        # on ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 (Debian, glibc
        # 2.31) -- confirmed via a real build failure
        # ("GLIBC_2.38 not found") on an actual ASU build request, not
        # caught by review. Fix: compile inside that same buildworker image
        # instead of on the bare host, so host tools match the glibc they'll
        # actually run against. --entrypoint "" is required: the image's own
        # /entry.sh silently drops back to the "buildbot" UID regardless of
        # --user, confirmed directly on the runner before touching this file.
        run: |
          # -e FORCE_UNSAFE_CONFIGURE=1: tools/tar's own configure script
          # refuses to run as root otherwise ("you should not run configure
          # as root") -- confirmed via a real failed run, --user 0:0 above
          # is exactly root inside the container.
          podman run --rm --user 0:0 --entrypoint "" -e FORCE_UNSAFE_CONFIGURE=1 \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c 'make -j"$(nproc)" world || { make -j1 V=s world; exit 1; }'

      - name: Publish downloads-tree artifacts
        working-directory: openwrt-src
        run: |
          set -euo pipefail
          TREE=/srv/asu-downloads
          OUT="$TREE/snapshots/targets/ipq40xx/generic"
          mkdir -p "$OUT"
          cp -v bin/targets/ipq40xx/generic/openwrt-imagebuilder-*.tar.* "$OUT"/
          rm -rf "$OUT/packages"
          cp -rv bin/targets/ipq40xx/generic/packages "$OUT"/
          cp -v bin/targets/ipq40xx/generic/profiles.json "$OUT"/

          # Same real bug found and fixed on MX60W (2026-09-17-18): a
          # target-specific packages/ tree alone isn't enough for owut/ASU
          # to see any base package (busybox, ubus, dnsmasq, etc) --
          # confirmed live on .103, which hit the identical "34 missing/133
          # out-of-date" signature despite this build otherwise succeeding
          # and its multi-profile (linksys_whw03 + linksys_whw03v2) fix
          # already being correct. Two things needed, neither of which
          # `make world` produces on its own:
          #   1. The arch-level bin/packages/<arch>/ tree (base, packages,
          #      luci, routing, ...) as a sibling to targets/, not just the
          #      target-specific kmod/kernel/base-files set above.
          #   2. A <arch>/feeds.conf listing which feed subdirectories
          #      exist -- confirmed via ASU's own source
          #      (github.com/openwrt/asu, asu/main.py's json_v1_arch_index
          #      + util.py's parse_feeds_conf): without it, ASU's feed list
          #      is empty and it never looks inside any of them regardless
          #      of their real content.
          # Shared "snapshots" tree with MX60W -- different arch
          # (apm821xx/powerpc vs ipq40xx/ARM), so scoping to this arch's own
          # subdir can't clobber it. RBS40V uses this same arch
          # (arm_cortex-a7_neon-vfpv4) but publishes to its own separate
          # "rbs40v" branch/path, not "snapshots" -- no collision there
          # either.
          ARCH_OUT="$TREE/snapshots/packages/arm_cortex-a7_neon-vfpv4"
          rm -rf "$ARCH_OUT"
          mkdir -p "$ARCH_OUT"
          cp -rv bin/packages/arm_cortex-a7_neon-vfpv4/. "$ARCH_OUT"/

          for feed_dir in "$ARCH_OUT"/*/; do
            feed_name=$(basename "$feed_dir")
            [ -f "$feed_dir/index.json" ] && echo "src-git $feed_name generated"
          done > "$ARCH_OUT/feeds.conf"
          echo "Generated feeds.conf:"; cat "$ARCH_OUT/feeds.conf"

          cd "$OUT"
          # -b (binary mode) is REQUIRED, not cosmetic: openwrt/docker's
          # setup.sh parses this file with `cut -d "*" -f 2` to find the
          # archive filename -- text-mode sha256sum (no asterisk) silently
          # produces a line that cut can't parse, breaking the image build
          # with no obvious error pointing back here. Confirmed against the
          # real format at downloads.openwrt.org/snapshots/targets/ipq40xx/generic/sha256sums.
          sha256sum -b openwrt-imagebuilder-*.tar.* > sha256sums

          # Real GPG signature, hard-required by setup.sh's `gpg --verify`.
          # Private key lives only in gha-runner's own keyring on this host --
          # see opensoho-asu-stack/secrets/README.md.
          # --batch --pinentry-mode loopback is REQUIRED even with a
          # passphrase-less key: bare `gpg --detach-sign` in this non-
          # interactive CI context failed with "gpg: cannot open '/dev/tty':
          # No such device or address" -- confirmed, not guessed, by testing
          # both forms directly on the runner before touching this file.
          # --yes is ALSO required: this writes into the persistent
          # downloads-tree directory (not an ephemeral workdir), so a re-run
          # must be able to overwrite its own prior output -- a first failed
          # attempt (before --batch was added) left a stub sha256sums.asc
          # behind that a later run then refused to overwrite with "File
          # exists", confirmed the hard way.
          gpg --batch --yes --pinentry-mode loopback \
            --local-user 21CF087E3594E01D440D5D6E5FB9EC71BB20CCAF \
            --detach-sign --armor --output sha256sums.asc sha256sums

          echo "Published:"
          ls -la "$OUT"

          TARGETS_JSON="$TREE/snapshots/.targets.json"
          [ -f "$TARGETS_JSON" ] || echo '{}' > "$TARGETS_JSON"
          jq '. + {"ipq40xx/generic": "arm_cortex-a7_neon-vfpv4"}' "$TARGETS_JSON" > "$TARGETS_JSON.tmp"
          mv "$TARGETS_JSON.tmp" "$TARGETS_JSON"

          [ -f "$TREE/.versions.json" ] || cat > "$TREE/.versions.json" <<'JSONEOF'
          {"stable_version": "", "oldstable_version": "", "upcoming_version": "", "versions_list": []}
          JSONEOF

      - name: Build custom ImageBuilder image
        working-directory: openwrt-src/docker/imagebuilder
        run: |
          podman build \
            --build-arg TARGET=ipq40xx/generic \
            --build-arg FILE_HOST=http://host.containers.internal \
            --build-arg VERSION_PATH=snapshots \
            --build-arg RUN_SETUP=1 \
            -t ghcr.io/eljefe80/imagebuilder:ipq40xx-generic-master \
            -f Containerfile .

      - name: Push ImageBuilder image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push ghcr.io/eljefe80/imagebuilder:ipq40xx-generic-master

      - name: Prune dangling podman images
        # --pull=always above means every run leaves the previous
        # buildworker/imagebuilder layers dangling (untagged) on guinevere.
        # if: always() so this still runs on a failed build too -- disk
        # pressure from repeated pulls is exactly worst on a run that keeps
        # failing and retrying. Only removes dangling/untagged images, never
        # anything currently tagged and in use.
        if: always()
        run: podman image prune -f
