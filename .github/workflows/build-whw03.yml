name: ASU build - WHW03

# WHW03 needs NO fork changes (see ~/share/projects/opensoho-asu-stack/TARGETS.md
# on the build host) -- this checks out upstream openwrt/openwrt, not this fork.
# Deliberately NOT push-triggered off this repo (nothing here would ever change
# for this device) -- manual dispatch + a periodic schedule to pick up new
# upstream commits. Never add a pull_request/pull_request_target trigger to
# this file: this repo is public and the runner is self-hosted (see
# guinevere's own gha-runner setup notes) -- only push/workflow_dispatch/
# schedule are safe trigger types here.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  build:
    runs-on: [self-hosted, asu-builder]
    steps:
      - name: Checkout upstream OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: master
          path: openwrt-src

      - name: Update and install feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Seed target config
        working-directory: openwrt-src
        run: |
          cat >> .config <<'EOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_linksys_whw03v2=y
          CONFIG_IB=y
          EOF
          make defconfig

      - name: Download sources
        working-directory: openwrt-src
        run: make download -j"$(nproc)"

      - name: Build (make world)
        working-directory: openwrt-src
        run: make -j"$(nproc)" world

      - name: Publish downloads-tree artifacts
        working-directory: openwrt-src
        run: |
          set -euo pipefail
          TREE=/srv/asu-downloads
          OUT="$TREE/snapshots/targets/ipq40xx/generic"
          mkdir -p "$OUT"
          cp -v bin/targets/ipq40xx/generic/openwrt-imagebuilder-*.tar.* "$OUT"/
          rm -rf "$OUT/packages"
          cp -rv bin/targets/ipq40xx/generic/packages "$OUT"/

          # profiles.json is what ASU's build-request validation actually
          # checks per-target (reload_profiles/validate_request) -- found and
          # fixed 2026-09-10 after the first successful build still couldn't
          # serve a real request. Always copy fresh; single target, safe to
          # overwrite outright (unlike .targets.json below, which is shared
          # across every device workflow and must be merged, not clobbered).
          cp -v bin/targets/ipq40xx/generic/profiles.json "$OUT"/

          cd "$OUT"
          sha256sum openwrt-imagebuilder-*.tar.* > sha256sums
          echo "Published:"
          ls -la "$OUT"

          # .targets.json (ASU's reload_targets) is shared across every
          # device workflow under this same "snapshots" branch -- merge our
          # one key in with jq rather than overwrite, so a WattBox/MX60W run
          # later doesn't erase this entry (or vice versa).
          TARGETS_JSON="$TREE/snapshots/.targets.json"
          [ -f "$TARGETS_JSON" ] || echo '{}' > "$TARGETS_JSON"
          jq '. + {"ipq40xx/generic": "arm_cortex-a7_neon-vfpv4"}' "$TARGETS_JSON" > "$TARGETS_JSON.tmp"
          mv "$TARGETS_JSON.tmp" "$TARGETS_JSON"

          # .versions.json (ASU's reload_versions) just needs to exist and be
          # valid JSON with these 4 keys -- ASU unconditionally adds the
          # literal string "SNAPSHOT" to app.versions once this fetches
          # successfully, regardless of the actual field values (confirmed by
          # reading asu/util.py's add_versions call directly). Create once,
          # never needs touching again for this single-branch setup.
          [ -f "$TREE/.versions.json" ] || cat > "$TREE/.versions.json" <<'JSONEOF'
          {"stable_version": "", "oldstable_version": "", "upcoming_version": "", "versions_list": []}
          JSONEOF
