name: ASU build - MX60W

# MX60W builds from real upstream openwrt/openwrt@master -- genuinely stock,
# zero fork changes, the only one of the four devices still like this.
# Deliberately NOT push-triggered off eljefe80/openwrt (nothing there would
# ever change for this device) -- manual dispatch + weekly schedule, same
# reasoning WHW03 originally had before it needed its own fork branch.
#
# Real design correction vs. that original WHW03 workflow: docker/imagebuilder/
# only exists in the FORK (eljefe80/openwrt), not upstream -- so unlike a
# fork-branch build where one checkout covers both the source and the
# Containerfile, this needs a SEPARATE fetch just for that directory. Uses a
# plain sparse git clone (not actions/checkout's sparse-checkout options) for
# a predictable, directly-testable command.
#
# base_container is a single global asu.toml setting, now pointed at
# ghcr.io/eljefe80/imagebuilder -- MX60W's source is stock, but it still
# needs its OWN pushed image under that same registry (even though its
# content is identical to what the official upstream image already has)
# purely so the one shared setting keeps working across all four devices.
#
# This repo is public and the runner is self-hosted -- only
# workflow_dispatch/schedule/push-to-a-branch-only-Jeff-pushes-to are safe
# trigger types. Never add pull_request/pull_request_target.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, asu-builder]
    steps:
      - name: Checkout upstream OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: master
          path: openwrt-src

      - name: Wipe stale host-tool build state
        working-directory: openwrt-src
        # actions/checkout's default clean does NOT reliably purge these on
        # this self-hosted runner -- see build-whw03.yml for the full
        # explanation. Force a clean slate every run.
        run: rm -rf staging_dir build_dir bin

      - name: Fetch imagebuilder Containerfile from eljefe80/openwrt
        run: |
          # rm -rf first: this plain shell clone (unlike the actions/checkout
          # step above) isn't auto-cleaned between runs on this persistent
          # self-hosted runner -- a retry after a failed run hit "destination
          # path already exists" for real.
          rm -rf docker-imagebuilder-src
          git clone --depth 1 --filter=blob:none --sparse https://github.com/eljefe80/openwrt.git docker-imagebuilder-src
          cd docker-imagebuilder-src
          git sparse-checkout set docker/imagebuilder

      - name: Add openwisp-config feed
        working-directory: openwrt-src
        run: echo "src-git openwisp https://github.com/openwisp/openwisp-config.git" >> feeds.conf.default

      - name: Update and install feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Seed target config
        working-directory: openwrt-src
        run: |
          cat >> .config <<'EOF'
          CONFIG_TARGET_apm821xx=y
          CONFIG_TARGET_apm821xx_nand=y
          CONFIG_TARGET_apm821xx_nand_DEVICE_meraki_mx60=y
          CONFIG_IB=y
          CONFIG_PACKAGE_openwisp-config=y
          EOF
          make defconfig

      - name: Download sources
        working-directory: openwrt-src
        # Also wrapped in the buildworker container -- see build-whw03.yml
        # for the full explanation: `download` builds the whole host-tools
        # chain (mkhash included) on the bare host otherwise, and `make
        # world`'s later containerized run just reuses those stale,
        # glibc-incompatible binaries instead of rebuilding them.
        run: |
          # --pull=always added after the wipe-workspace fix above STILL didn't
          # fix this: proved locally that a genuinely fresh pull of this exact
          # image builds a fully glibc-2.14-compatible mkhash, so the remaining
          # explanation is guinevere's rootless podman using a STALE cached
          # local copy of this tag from earlier smoke-testing, never the same
          # bits ghcr.io serves now. Forces a fresh pull every run.
          podman run --rm --pull=always --user 0:0 --entrypoint "" \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c 'make download -j"$(nproc)"'

      - name: Build (make world)
        working-directory: openwrt-src
        # Wrapped in the buildworker container (see WHW03 workflow for the
        # full explanation): host tools compiled directly on guinevere's
        # bare Ubuntu 26.04 (glibc 2.38+) failed a real ASU build request
        # with "GLIBC_2.38 not found" against
        # ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 (glibc 2.31).
        run: |
          podman run --rm --pull=always --user 0:0 --entrypoint "" \
            -v "$(pwd):/workdir" -w /workdir \
            ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v21 \
            bash -c 'make -j"$(nproc)" world || { make -j1 V=s world; exit 1; }'

      - name: Publish downloads-tree artifacts
        working-directory: openwrt-src
        run: |
          set -euo pipefail
          TREE=/srv/asu-downloads
          OUT="$TREE/snapshots/targets/apm821xx/nand"
          mkdir -p "$OUT"
          cp -v bin/targets/apm821xx/nand/openwrt-imagebuilder-*.tar.* "$OUT"/
          rm -rf "$OUT/packages"
          cp -rv bin/targets/apm821xx/nand/packages "$OUT"/
          cp -v bin/targets/apm821xx/nand/profiles.json "$OUT"/

          cd "$OUT"
          sha256sum -b openwrt-imagebuilder-*.tar.* > sha256sums
          gpg --batch --yes --pinentry-mode loopback \
            --local-user 21CF087E3594E01D440D5D6E5FB9EC71BB20CCAF \
            --detach-sign --armor --output sha256sums.asc sha256sums

          echo "Published:"
          ls -la "$OUT"

          # Shared "snapshots" branch/path with WHW03 -- merge our own
          # target key in with jq, never overwrite (WHW03's ipq40xx/generic
          # entry must survive this).
          TARGETS_JSON="$TREE/snapshots/.targets.json"
          [ -f "$TARGETS_JSON" ] || echo '{}' > "$TARGETS_JSON"
          jq '. + {"apm821xx/nand": "powerpc_464fp"}' "$TARGETS_JSON" > "$TARGETS_JSON.tmp"
          mv "$TARGETS_JSON.tmp" "$TARGETS_JSON"

      - name: Build custom ImageBuilder image
        working-directory: docker-imagebuilder-src/docker/imagebuilder
        run: |
          podman build \
            --build-arg TARGET=apm821xx/nand \
            --build-arg FILE_HOST=http://10.203.16.45 \
            --build-arg VERSION_PATH=snapshots \
            --build-arg RUN_SETUP=1 \
            -t ghcr.io/eljefe80/imagebuilder:apm821xx-nand-master \
            -f Containerfile .

      - name: Push ImageBuilder image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push ghcr.io/eljefe80/imagebuilder:apm821xx-nand-master

      - name: Prune dangling podman images
        # --pull=always above means every run leaves the previous
        # buildworker/imagebuilder layers dangling (untagged) on guinevere.
        # if: always() so this still runs on a failed build too -- disk
        # pressure from repeated pulls is exactly worst on a run that keeps
        # failing and retrying. Only removes dangling/untagged images, never
        # anything currently tagged and in use.
        if: always()
        run: podman image prune -f
